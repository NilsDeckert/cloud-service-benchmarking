- name: Configure redis node
  hosts: redis
  become: yes
  tasks:
    - name: Import redis tasks
      ansible.builtin.import_tasks: ./tasks/install_redis.yml
  handlers:
    - name: Restart redis
      ansible.builtin.service:
        name: redis-server
        state: restarted

- name: Configure keydb
  hosts: keydb
  become: yes
  tasks:
    - name: Import keydb tasks
      ansible.builtin.import_tasks: ./tasks/install_keydb.yml
  handlers:
    - name: Restart keydb
      ansible.builtin.service:
        name: keydb-server
        state: restarted

- name: Configure valkey
  hosts: valkey
  become: yes
  tasks:
    - name: Import valkey tasks
      ansible.builtin.import_tasks: ./tasks/install_valkey.yml
  handlers:
    - name: Restart valkey
      ansible.builtin.service:
        name: valkey-server
        state: restarted

- name: Configure acdis
  hosts: acdis
  become: yes
  tasks:
    - name: Import acdis tasks
      ansible.builtin.import_tasks: ./roles/acdis/tasks/main.yml
