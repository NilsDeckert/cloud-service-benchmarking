---
- name: Install build-essentials
  ansible.builtin.apt:
    name: "build-essential"
    update_cache: yes

# https://waylonwalker.com/install-rust/
- name: Check if cargo is installed
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.cargo/bin/cargo"
  register: cargo_bin

- name: Download Rust Installer
  when: not cargo_bin.stat.exists
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: "/tmp/sh.rustup.rs" # Download to tmp
    mode: '0755'
    force: 'yes'

- name: Install rust/cargo
  when: not cargo_bin.stat.exists
  ansible.builtin.command: "/tmp/sh.rustup.rs -y"

- name: Clone acdis github repository
  ansible.builtin.git:
    repo: "https://github.com/NilsDeckert/acdis.git"
    version: "tikv-jemallocator"
    # version: main # Feel free to change the branch here
    dest: "{{ ansible_user_dir }}/acdis"
    force: true

- name: Set `acdis_bin` based on hostname
  ansible.builtin.set_fact:
    acdis_bin: "{{ 'node' if (ansible_hostname | regex_search('^acdis[2-9][0-9]*$')) else 'acdis' }}"

- name: Build acdis binary
  ansible.builtin.command: "{{ ansible_user_dir }}/.cargo/bin/cargo build --release --bin {{ acdis_bin }}"
  args:
    chdir: "{{ ansible_user_dir }}/acdis"

- name: Create /opt/acdis directory
  ansible.builtin.file:
    path: "/opt/acdis"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Copy binary to /opt/acdis
  ansible.builtin.copy:
    src: "{{ ansible_user_dir }}/acdis/target/release/{{ acdis_bin }}"
    dest: "/opt/acdis/acdis"
    mode: "0755" # Executable, but not writable by everyone
    remote_src: true
    owner: root
    group: root
  become: true

- name: Upload unit file
  ansible.builtin.template:
    src: "../files/acdis.service.js"
    dest: "/etc/systemd/system/acdis.service"
    mode: '0755'
    owner: root
    group: root

# Make sure the cluster nodes don't join at the same time.
# Might run into race-conditions otherwise
- name: Rollout
  ansible.builtin.include_tasks: restart.yml
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    loop_var: active_node
  when: inventory_hostname == active_node
